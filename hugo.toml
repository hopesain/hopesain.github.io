baseURL = "https://hopesain.github.io/"
locale = 'en-us'
title = 'Hope Sain'

[params]
  tagline = 'Computer programmer from Malawi.'

# Shared by the header and the footer's "Explore" column
[menus]
  [[menus.main]]
    name = 'Home'
    url = '/'
    weight = 10
  [[menus.main]]
    name = 'Projects'
    url = '/projects/'
    weight = 20
  [[menus.main]]
    name = 'Articles'
    url = '/articles/'
    weight = 30
  [[menus.main]]
    name = 'Contact'
    url = '/contact/'
    weight = 40

[caches]
  [caches.images]
    dir = ':cacheDir/images'

# Project logos live in static/images/projects (drop-in replaceable) but are
# mounted into assets so Hugo can resize and compress them. The originals are
# excluded from static so only the optimised versions are published.
# Declaring mounts replaces the defaults, so assets and static are re-added.
[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'static'
    target = 'static'
    files = ['! images/projects/**']
  [[module.mounts]]
    source = 'static/images/projects'
    target = 'assets/images/projects'
