baseURL = "https://hopesain.github.io/"
locale = 'en-us'
title = 'Hope Sain'

# robots.txt (layouts/robots.txt) points search engines at /sitemap.xml
enableRobotsTXT = true

# Tag and category pages aren't used, so don't build (or index) them
disableKinds = ['taxonomy', 'term']

[params]
  role = 'Computer Programmer'
  tagline = 'Computer programmer from Malawi.'
  # Shown in search results and link previews for the home page
  description = 'Hope Sain is a computer programmer from Malawi building backend systems, APIs, data and machine learning solutions, and embedded IoT systems.'
  # From Google Search Console: Settings > Ownership verification > HTML tag.
  # Paste only the content="..." value here.
  googleSiteVerification = 'XSrrq6bVKWO_wQBqlHMnCmVUJTB4DIDwUppRd4N9tGg'

# Projects now come from data/projects.json, so the old Markdown pages in
# content/projects/ are not built (keeps empty placeholder pages out of Google)
[[cascade]]
  [cascade.build]
    render = 'never'
    list = 'never'
  [cascade.target]
    path = '/projects/*'

# Articles aren't ready yet: still built, but kept out of the sitemap and
# marked noindex. Remove this block once the first articles are published.
[[cascade]]
  noindex = true
  [cascade.sitemap]
    disable = true
  [cascade.target]
    path = '{/articles,/articles/**}'

# Shared by the header and the footer's "Explore" column
[menus]
  [[menus.main]]
    name = 'Home'
    url = '/'
    weight = 10
  [[menus.main]]
    name = 'Projects'
    url = '/projects/'
    weight = 20
  [[menus.main]]
    name = 'Articles'
    url = '/articles/'
    weight = 30
  [[menus.main]]
    name = 'Contact'
    url = '/contact/'
    weight = 40

[caches]
  [caches.images]
    dir = ':cacheDir/images'

# Project logos (static/images/projects) and the profile photo
# (static/images/profile) are drop-in replaceable, but are mounted into assets
# so Hugo can resize and compress them. The originals are excluded from static
# so only the optimised versions are published.
# Declaring mounts replaces the defaults, so assets and static are re-added.
[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'static'
    target = 'static'
    files = ['! images/projects/**', '! images/profile/**']
  [[module.mounts]]
    source = 'static/images/projects'
    target = 'assets/images/projects'
  [[module.mounts]]
    source = 'static/images/profile'
    target = 'assets/images/profile'
