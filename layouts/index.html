{{ define "main" }}
    {{ $contact := partial "contact-info.html" . }}
    <div class="container">
        <div class="hero-section">
            <div class="profile-image-section">
                {{ partial "profile-image.html" (dict "eager" true) }}
            </div>

            <div class="profile-summary">
                <h1 class="hero-title">Hello, I'm Hope Sain</h1>

                <p class="hero-description">
                    Computer programmer from Malawi focused on high-performance
                    software and resilient systems.
                </p>

                {{ partial "social-links.html" $contact }}
            </div>
        </div>
    </div>
{{ end }}
