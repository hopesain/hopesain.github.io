<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.tagline }}{{ end }}">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/css/styles.css">

    <!-- Flag JS support before first paint so reveal elements don't flash.
         Without JS, nothing is hidden. -->
    <script>document.documentElement.classList.add('js');</script>
</head>
<body>
    <header class="header">
        {{ partial "header.html" . }}
    </header>

    <main class="content">
        {{ block "main" . }}
            <p>This is the foundation base and the contents within it will be replaced</p>
        {{ end }}
    </main>

    <footer class="footer">
        {{ partial "footer.html" . }}
    </footer>

    <script src="/js/scripts.js" defer></script>
</body>
</html>
