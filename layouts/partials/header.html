{{ $current := .RelPermalink }}
<div class="nav-bar">

    <a href="/" class="brand">Hope Sain</a>

    <button
        class="menu-toggle"
        type="button"
        aria-label="Open navigation menu"
        aria-expanded="false"
        aria-controls="primary-navigation"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav class="nav-items-section" id="primary-navigation" aria-label="Primary">
        <ul class="nav-items">
            {{ range site.Menus.main }}
                {{ $active := or (eq $current .URL) (and (ne .URL "/") (hasPrefix $current .URL)) }}
                <li>
                    <a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
                </li>
            {{ end }}
        </ul>
    </nav>

</div>
